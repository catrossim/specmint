<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Dashboard (Protected) · specmint with-auth example</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main { text-align: center; max-width: 480px; padding: 2rem; }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    p { color: #555; line-height: 1.6; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: #e8f3ff;
      color: #0071e3;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .order-list {
      text-align: left;
      margin-top: 2rem;
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .order-list li {
      padding: 0.5rem 0;
      border-bottom: 1px solid #eee;
      list-style: none;
    }
    .order-list li:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <main>
    <span class="badge" data-testid="role-badge">Admin</span>
    <h1 data-testid="dashboard-title">订单 Dashboard</h1>
    <p>登录成功，欢迎回来，admin。</p>
    <ul class="order-list" data-testid="order-list">
      <li data-testid="order-item">#1001 · iPhone 15 Pro · 待发货</li>
      <li data-testid="order-item">#1002 · MacBook Air M3 · 已发货</li>
      <li data-testid="order-item">#1003 · AirPods Pro · 已签收</li>
    </ul>
  </main>

  <!--
    客户端 auth gate：演示用 cookie 校验。
    真实项目应交给 server 端（401/302 → /login），但 client gate 足以演示 generate 时
    storageState 是否真正生效 —— 没 cookie 跳走，cookie 在就渲染 Dashboard。
  -->
  <script>
    if (!document.cookie.split('; ').some(c => c.startsWith('auth-session='))) {
      location.replace('/login-demo.html?reason=missing-session');
    }
  </script>
</body>
</html>
