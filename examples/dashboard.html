<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Dashboard · auto-test examples</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main { text-align: center; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: #555; }
    nav { margin-top: 1.5rem; }
    a {
      color: #0071e3;
      text-decoration: none;
      margin: 0 0.75rem;
      padding: 0.5rem 1rem;
      border: 1px solid #0071e3;
      border-radius: 6px;
    }
    a:hover { background: #0071e3; color: white; }
  </style>
</head>
<body>
  <main>
    <h1 data-testid="dashboard-title">Dashboard</h1>
    <p>登录成功，欢迎回来。</p>
    <nav>
      <a href="/login-demo.html" data-testid="logout">退出登录</a>
    </nav>
  </main>
</body>
</html>
