<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Demo · auto-test examples</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --fg: #1d1d1f;
      --accent: #0071e3;
      --error: #d80027;
      --success: #4f8a10;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      background: white;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label {
      display: block;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    label > span { display: block; margin-bottom: 0.25rem; color: #555; }
    input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d1d1d6;
      border-radius: 6px;
      font-size: 1rem;
    }
    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: var(--accent);
    }
    button {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.6rem;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    #message {
      min-height: 1.25rem;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    #message.error { color: var(--error); }
    #message.success { color: var(--success); }
  </style>
</head>
<body>
  <main>
    <h1>登录</h1>
    <form id="login-form">
      <label>
        <span>用户名</span>
        <input
          id="username"
          name="username"
          data-testid="username"
          type="text"
          autocomplete="username"
        />
      </label>
      <label>
        <span>密码</span>
        <input
          id="password"
          name="password"
          data-testid="password"
          type="password"
          autocomplete="current-password"
        />
      </label>
      <button type="submit" data-testid="login-submit">登录</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <script>
    (() => {
      const form = document.getElementById('login-form');
      const message = document.getElementById('message');
      const VALID = { username: 'admin', password: 'admin123' };

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        message.className = '';
        if (username === VALID.username && password === VALID.password) {
          message.textContent = '欢迎，' + username;
          message.classList.add('success');
          setTimeout(() => { location.href = '/dashboard.html'; }, 400);
        } else {
          message.textContent = '用户名或密码错误';
          message.classList.add('error');
        }
      });
    })();
  </script>
</body>
</html>
